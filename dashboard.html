<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your profile — Hobbiyaa</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .dash{ max-width: 720px; margin: 0 auto; padding: 40px 24px 100px; }

  /* ===== Instagram-style profile header ===== */
  .ig-header{
    display: flex; gap: 36px; align-items: center; flex-wrap: wrap;
    padding-bottom: 28px; border-bottom: 1px solid rgba(255,255,255,0.12);
    margin-bottom: 28px;
  }
  .ig-avatar{
    width: 110px; height: 110px; border-radius: 50%; object-fit: cover;
    border: 2px solid var(--ink); flex-shrink: 0; background: var(--paper);
  }
  .ig-info{ flex: 1; min-width: 220px; }
  .ig-name-row{ display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .ig-name-row h1{ font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; }
  .edit-profile-btn{
    font-family: var(--font-body); font-weight: 700; font-size: 0.85rem;
    padding: 7px 16px; border-radius: var(--radius); border: 2px solid var(--ink);
    background: none; color: var(--ink);
  }
  .edit-profile-btn:hover{ background: var(--ink); color: var(--paper); }

  .ig-stats{ display: flex; gap: 32px; margin-bottom: 16px; }
  .ig-stats div{ text-align: left; }
  .ig-stats b{ display: block; font-family: var(--font-display); font-size: 1.15rem; }
  .ig-stats span{ font-size: 0.78rem; color: var(--ink-soft); }

  .ig-bio{ font-size: 0.92rem; color: var(--ink-soft); line-height: 1.6; }
  .ig-bio strong{ color: var(--ink); }
  .ig-bio .hobby-tags{ margin-top: 10px; }
  .hobby-tags{ display: flex; flex-wrap: wrap; gap: 8px; }
  .hobby-tags span{
    font-family: var(--font-mono); font-size: 0.72rem;
    background: var(--green); color: var(--paper);
    padding: 4px 10px; border-radius: 999px;
  }

  /* ===== Posts grid ===== */
  .section-title{ font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin: 32px 0 14px; }
  .ig-posts-grid{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 8px; }
  .ig-post-tile{
    aspect-ratio: 1 / 1; background: var(--paper); border: 1px solid rgba(255,255,255,0.1);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 10px; text-align: center; overflow: hidden; gap: 4px;
  }
  .ig-post-tile .emoji{ font-size: 1.9rem; }
  .ig-post-tile .loc{ font-size: 0.68rem; color: var(--ink-soft); line-height: 1.3; }
  .ig-post-tile .when{ font-size: 0.62rem; color: var(--ink-soft); opacity: 0.8; }
  .ig-post-tile-photo{
    background-size: cover; background-position: center; justify-content: flex-end;
    padding: 0; position: relative;
  }
  .ig-post-tile-overlay{
    width: 100%; padding: 10px 8px 8px;
    background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    display: flex; flex-direction: column; gap: 2px;
  }
  .ig-post-tile-overlay .loc{ color: #fff; font-weight: 500; }
  .ig-post-tile-overlay .when{ color: rgba(255,255,255,0.75); }

  /* ===== Requests / connections ===== */
  .request-row, .connection-row{
    background: var(--paper); border: 2px solid var(--ink); border-radius: 8px;
    padding: 14px 18px; margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .request-row .info b, .connection-row .info b{ font-family: var(--font-display); }
  .request-actions{ display: flex; gap: 8px; }
  .request-actions button{
    font-family: var(--font-body); font-weight: 700; font-size: 0.85rem;
    padding: 7px 14px; border-radius: var(--radius); border: 2px solid var(--ink); cursor: pointer;
  }
  .accept-btn{ background: var(--green); color: var(--paper); border-color: var(--green); }
  .decline-btn{ background: none; }
  .empty-note{ color: var(--ink-soft); font-size: 0.9rem; grid-column: 1 / -1; padding: 20px 0; text-align: center; }

  .logout-btn{ background: none; border: 2px solid var(--ink); cursor: pointer; }
  .logout-btn:hover{ background: var(--ink); color: var(--paper); }
  .top-nav-links{ display: flex; gap: 18px; align-items: center; }
  .top-nav-links a{ font-weight: 500; font-size: 0.95rem; }
  .icon-link{ font-size: 1.3rem; line-height: 1; text-decoration: none; position: relative; color: var(--ink); }
  .icon-link .badge{
    position: absolute; top: -6px; right: -8px; background: var(--ink); color: var(--paper);
    font-size: 0.62rem; font-weight: 700; border-radius: 999px; padding: 1px 5px; min-width: 15px; text-align: center;
  }

  @media (max-width: 520px){
    .ig-header{ gap: 20px; }
    .ig-avatar{ width: 84px; height: 84px; }
    .ig-stats{ gap: 20px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="feed.html" class="logo">
      <img src="assets/logo-mark.png" alt="" class="logo-mark" onerror="this.style.display='none'">
      Hobbiyaa
    </a>
    <div class="top-nav-links">
      <a href="browse.html">Browse people</a>
      <a href="map.html" class="icon-link" aria-label="Map" title="Map">🗺️</a>
      <a href="messages.html" class="icon-link" aria-label="Messages">💬<span class="badge" id="messagesBadge" style="display:none;"></span></a>
      <button class="btn logout-btn" id="logoutBtn">Log out</button>
    </div>
  </div>
</header>

<main class="dash">
  <div id="profileHeader">Loading your profile…</div>

  <div class="section-title">Posts</div>
  <div class="ig-posts-grid" id="postsGrid"><p class="empty-note">Loading…</p></div>

  <div class="section-title">Requests waiting for you</div>
  <div id="requestsList">Loading…</div>

  <div class="section-title">Your connections</div>
  <div id="connectionsList">Loading…</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="toast.js"></script>
<script src="notifications.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
