<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — Hobbiyaa</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{ height: 100vh; overflow: hidden; }
  .chat-page{ display: flex; flex-direction: column; height: calc(100vh - 65px); max-width: 720px; margin: 0 auto; }

  .chat-header{
    display: flex; align-items: center; gap: 12px; padding: 14px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.12); flex-shrink: 0;
  }
  .chat-header a.back{ font-size: 1.3rem; color: var(--ink); }
  .chat-header img{ width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--ink); }
  .chat-header .name{ font-family: var(--font-display); font-weight: 700; }
  .chat-header .city{ font-size: 0.8rem; color: var(--ink-soft); }

  .messages-list{
    flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px;
  }
  .msg-row{ display: flex; }
  .msg-row.mine{ justify-content: flex-end; }
  .msg-bubble{
    max-width: 72%; padding: 10px 14px; border-radius: 14px; font-size: 0.94rem; line-height: 1.4;
    border: 2px solid var(--ink);
  }
  .msg-row.mine .msg-bubble{ background: #2b6cf6; color: #ffffff; border-color: #2b6cf6; }
  .msg-row.theirs .msg-bubble{ background: var(--paper); color: var(--ink); }
  .msg-bubble img{ max-width: 220px; border-radius: 8px; display: block; margin-top: 4px; }
  .msg-sender-label{ font-size: 0.72rem; font-weight: 700; color: var(--ink-soft); margin-bottom: 3px; }

  .msg-bubble{ position: relative; }
  .msg-menu-btn{
    position: absolute; top: 2px; right: 4px; background: none; border: none;
    color: rgba(255,255,255,0.7); font-size: 1rem; line-height: 1; cursor: pointer;
    opacity: 0; transition: opacity 0.15s ease; padding: 2px 4px;
  }
  .msg-bubble:hover .msg-menu-btn{ opacity: 1; }
  .msg-menu-dropdown{
    position: absolute; top: 24px; right: 4px; z-index: 20;
    background: var(--paper); border: 2px solid var(--ink); border-radius: 8px; overflow: hidden;
    min-width: 100px;
  }
  .msg-menu-dropdown button{
    display: block; width: 100%; text-align: left; padding: 8px 12px;
    background: none; border: none; color: var(--ink); font-family: var(--font-body);
    font-size: 0.85rem; cursor: pointer;
  }
  .msg-menu-dropdown button:hover{ background: rgba(255,255,255,0.08); }
  .msg-menu-dropdown button + button{ border-top: 1px solid rgba(255,255,255,0.1); }

  .msg-ticks{ opacity: 0.7; }
  .msg-ticks.delivered{ opacity: 0.9; }
  .msg-ticks.read{ color: #a8caff; opacity: 1; font-weight: 700; }
  .msg-deleted{ font-style: italic; opacity: 0.7; }
  .msg-content-area{ min-height: 1em; }
  .msg-time{ font-size: 0.68rem; color: var(--ink-soft); margin-top: 4px; display: block; text-align: right; }
  .msg-row.mine .msg-time{ color: rgba(255,255,255,0.75); }
  .msg-row.theirs .msg-time{ text-align: left; }
  .empty-note{ color: var(--ink-soft); text-align: center; padding: 40px 0; }

  .composer{
    display: flex; align-items: center; gap: 8px; padding: 14px 16px;
    border-top: 1px solid rgba(255,255,255,0.12); flex-shrink: 0; position: relative;
  }
  .composer input[type="text"]{
    flex: 1; font-family: var(--font-body); font-size: 0.96rem;
    padding: 11px 14px; border: 2px solid var(--ink); border-radius: 999px;
    background: var(--paper); color: var(--ink);
  }
  .composer input[type="text"]:focus{ outline: 2px solid var(--green); outline-offset: 1px; }
  .icon-btn{
    background: none; border: none; font-size: 1.3rem; cursor: pointer; padding: 6px;
    line-height: 1; color: var(--ink);
  }
  .send-btn{
    background: var(--ink); color: var(--paper); border: none; border-radius: 50%;
    width: 40px; height: 40px; font-size: 1.1rem; cursor: pointer; flex-shrink: 0;
  }
  .send-btn:disabled{ opacity: 0.4; cursor: default; }

  .emoji-panel{
    position: absolute; bottom: 62px; left: 16px; width: 260px;
    background: var(--paper); border: 2px solid var(--ink); border-radius: 10px;
    padding: 10px; display: none; grid-template-columns: repeat(7, 1fr); gap: 4px;
    max-height: 200px; overflow-y: auto;
  }
  .emoji-panel.open{ display: grid; }
  .emoji-panel button{
    background: none; border: none; font-size: 1.3rem; cursor: pointer; padding: 4px;
    border-radius: 6px;
  }
  .emoji-panel button:hover{ background: rgba(255,255,255,0.1); }

  #imageInput{ display: none; }
  .image-preview-bar{ display: none; padding: 0 16px 10px; }
  .image-preview-bar.show{ display: block; }
  .image-preview-bar .preview-wrap{ position: relative; display: inline-block; }
  .image-preview-bar img{ max-height: 80px; border-radius: 8px; border: 2px solid var(--ink); }
  .image-preview-bar .remove-preview{
    position: absolute; top: -8px; right: -8px; background: var(--ink); color: var(--paper);
    border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-size: 0.8rem;
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="feed.html" class="logo">
      <img src="assets/logo-mark.png" alt="" class="logo-mark" onerror="this.style.display='none'">
      Hobbiyaa
    </a>
    <div class="top-nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="messages.html" class="icon-link" aria-label="Messages">💬<span class="badge" id="messagesBadge" style="display:none;"></span></a>
    </div>
  </div>
</header>

<main class="chat-page">
  <div class="chat-header">
    <a href="messages.html" class="back" aria-label="Back">←</a>
    <a href="#" id="headerProfileLink" style="display:contents;">
      <img id="otherAvatar" src="" alt="">
      <div>
        <div class="name" id="otherName">Loading…</div>
        <div class="city" id="otherCity"></div>
      </div>
    </a>
  </div>

  <div class="messages-list" id="messagesList">
    <p class="empty-note">Loading messages…</p>
  </div>

  <div class="image-preview-bar" id="imagePreviewBar">
    <div class="preview-wrap">
      <img id="imagePreviewImg" src="" alt="Selected image">
      <button class="remove-preview" id="removePreviewBtn">✕</button>
    </div>
  </div>

  <div class="emoji-panel" id="emojiPanel"></div>

  <form class="composer" id="composerForm">
    <button type="button" class="icon-btn" id="emojiToggleBtn" aria-label="Emoji">😊</button>
    <button type="button" class="icon-btn" id="imageToggleBtn" aria-label="Attach image">📷</button>
    <input type="file" id="imageInput" accept="image/*">
    <input type="text" id="messageInput" placeholder="Type a message…" autocomplete="off">
    <button type="submit" class="send-btn" id="sendBtn">➤</button>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="toast.js"></script>
<script src="notifications.js"></script>
<script src="blocks.js"></script>
<script src="chat.js"></script>
</body>
</html>
