<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Hobbiyaa</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .profile-wrap{ max-width: 720px; margin: 0 auto; padding: 40px 24px 100px; }

  .ig-header{
    display: flex; gap: 36px; align-items: center; flex-wrap: wrap;
    padding-bottom: 28px; border-bottom: 1px solid rgba(255,255,255,0.12);
    margin-bottom: 28px;
  }
  .ig-avatar{
    width: 110px; height: 110px; border-radius: 50%; object-fit: cover;
    border: 2px solid var(--ink); flex-shrink: 0; background: var(--paper);
  }
  .ig-info{ flex: 1; min-width: 220px; }
  .ig-name-row{ display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .ig-name-row h1{ font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; }

  .action-btn{
    font-family: var(--font-body); font-weight: 700; font-size: 0.85rem;
    padding: 8px 18px; border-radius: var(--radius); border: 2px solid var(--ink);
    background: none; color: var(--ink); cursor: pointer; text-decoration: none; display: inline-block;
  }
  .action-btn:hover{ background: var(--ink); color: var(--paper); }
  .action-btn.primary{ background: #2b6cf6; color: #fff; border-color: #2b6cf6; }
  .action-btn.primary:hover{ opacity: 0.9; }
  .action-btn:disabled{ opacity: 0.5; cursor: default; }

  .ig-stats{ display: flex; gap: 32px; margin-bottom: 16px; }
  .ig-stats div{ text-align: left; }
  .ig-stats b{ display: block; font-family: var(--font-display); font-size: 1.15rem; }
  .ig-stats span{ font-size: 0.78rem; color: var(--ink-soft); }

  .ig-bio{ font-size: 0.92rem; color: var(--ink-soft); line-height: 1.6; }
  .ig-bio strong{ color: var(--ink); }
  .ig-bio .hobby-tags{ margin-top: 10px; }
  .hobby-tags{ display: flex; flex-wrap: wrap; gap: 8px; }
  .hobby-tags span{
    font-family: var(--font-mono); font-size: 0.72rem;
    background: var(--green); color: var(--paper);
    padding: 4px 10px; border-radius: 999px;
  }

  .section-title{ font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin: 32px 0 14px; }
  .ig-posts-grid{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .ig-post-tile{
    aspect-ratio: 1 / 1; background: var(--paper); border: 1px solid rgba(255,255,255,0.1);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 10px; text-align: center; overflow: hidden; gap: 4px;
  }
  .ig-post-tile .emoji{ font-size: 1.9rem; }
  .ig-post-tile .loc{ font-size: 0.68rem; color: var(--ink-soft); line-height: 1.3; }
  .ig-post-tile-photo{ background-size: cover; background-position: center; justify-content: flex-end; padding: 0; position: relative; }
  .ig-post-tile-overlay{
    width: 100%; padding: 10px 8px 8px; background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    display: flex; flex-direction: column; gap: 2px;
  }
  .ig-post-tile-overlay .loc{ color: #fff; font-weight: 500; }
  .empty-note{ color: var(--ink-soft); text-align: center; padding: 30px 0; grid-column: 1 / -1; }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="feed.html" class="logo">
      <img src="assets/logo-mark.png" alt="" class="logo-mark" onerror="this.style.display='none'">
      Hobbiyaa
    </a>
    <div class="top-nav-links">
      <a href="browse.html">Browse</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="map.html" class="icon-link" aria-label="Map" title="Map">🗺️</a>
      <a href="messages.html" class="icon-link" aria-label="Messages">💬<span class="badge" id="messagesBadge" style="display:none;"></span></a>
    </div>
  </div>
</header>

<main class="profile-wrap">
  <div id="profileHeader">Loading profile…</div>
  <div class="section-title">Posts</div>
  <div class="ig-posts-grid" id="postsGrid"><p class="empty-note">Loading…</p></div>
</main>

<!-- Report/Block modal -->
<div id="reportModal" style="display:none; position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,0.85); align-items:center; justify-content:center; padding:20px;">
  <div style="background: var(--paper); border: 2px solid var(--ink); border-radius: 10px; padding: 22px; max-width: 400px; width: 100%;">
    <h3 id="reportModalTitle" style="font-family: var(--font-display); margin-bottom: 14px; font-size: 1.1rem;">Report this profile</h3>
    <div id="reportReasonFields">
      <select id="reportReason" style="width:100%; font-family: var(--font-body); font-size: 0.95rem; padding: 10px 12px; border: 2px solid var(--ink); border-radius: var(--radius); background: var(--cream); color: var(--ink); margin-bottom: 12px;">
        <option value="Spam">Spam</option>
        <option value="Harassment">Harassment or abuse</option>
        <option value="Fake profile">Fake profile</option>
        <option value="Inappropriate content">Inappropriate content</option>
        <option value="Other">Other</option>
      </select>
      <textarea id="reportDetails" placeholder="Add any extra detail (optional)" style="width:100%; min-height:70px; font-family: var(--font-body); font-size: 0.9rem; padding: 10px 12px; border: 2px solid var(--ink); border-radius: var(--radius); background: var(--cream); color: var(--ink); margin-bottom: 14px;"></textarea>
    </div>
    <p id="blockConfirmText" style="display:none; color: var(--ink-soft); font-size: 0.92rem; margin-bottom: 16px;"></p>
    <div style="display:flex; gap:10px; justify-content:flex-end;">
      <button type="button" id="cancelReportBtn" class="action-btn">Cancel</button>
      <button type="button" id="confirmReportBtn" class="action-btn primary">Submit</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="toast.js"></script>
<script src="notifications.js"></script>
<script src="blocks.js"></script>
<script src="profile-view.js"></script>
</body>
</html>
