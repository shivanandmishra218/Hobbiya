<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map — Hobbiyaa</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
<style>
  body{ height: 100vh; overflow: hidden; }
  .map-page{ display: flex; flex-direction: column; height: calc(100vh - 65px); }
  .map-top{ padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,0.12); }
  .map-top h1{ font-size: 1.3rem; margin-bottom: 2px; }
  .map-top .sub{ font-size: 0.85rem; color: var(--ink-soft); }
  #map{ flex: 1; background: #111; filter: grayscale(1) invert(1) contrast(0.9); }

  /* Popup styling to match the dark theme */
  .leaflet-popup-content-wrapper{ background: var(--paper); color: var(--ink); border-radius: 8px; }
  .leaflet-popup-tip{ background: var(--paper); }
  .map-popup .hobby{ font-family: var(--font-mono); font-size: 0.75rem; font-weight: 700; color: var(--ink); }
  .map-popup .loc{ font-weight: 700; margin: 4px 0 2px; }
  .map-popup .desc{ font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 6px; }
  .venue-marker-icon{ font-size: 22px; text-align: center; line-height: 28px; }
  .map-popup a{ font-size: 0.82rem; font-weight: 700; }
  .empty-note{ color: var(--ink-soft); text-align: center; padding: 60px 20px; }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="feed.html" class="logo">
      <img src="assets/logo-mark.png" alt="" class="logo-mark" onerror="this.style.display='none'">
      Hobbiyaa
    </a>
    <div class="top-nav-links">
      <a href="browse.html">Browse</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="messages.html" class="icon-link" aria-label="Messages">💬<span class="badge" id="messagesBadge" style="display:none;"></span></a>
    </div>
  </div>
</header>

<main class="map-page">
  <div class="map-top">
    <h1>🗺️ Nearby posts</h1>
    <p class="sub" id="mapSub">Loading…</p>
  </div>
  <div id="map"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="toast.js"></script>
<script src="notifications.js"></script>
<script src="blocks.js"></script>
<script src="map.js"></script>
</body>
</html>
