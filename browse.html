<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse — Hobbiyaa</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .browse-wrap{ max-width: 800px; margin: 0 auto; padding: 48px 24px 100px; }
  .browse-wrap h1{ font-size: 1.9rem; margin-bottom: 6px; }
  .browse-wrap .sub{ color: var(--ink-soft); margin-bottom: 32px; }
  .people-grid{ display: grid; gap: 16px; }
  .person-card{
    background: var(--paper); border: 2px solid var(--ink); border-radius: 8px;
    padding: 20px 22px; display: flex; justify-content: space-between; align-items: center; gap: 16px;
    flex-wrap: wrap;
  }
  .person-info{ display: flex; gap: 14px; align-items: flex-start; }
  .person-avatar{
    width: 52px; height: 52px; border-radius: 50%; object-fit: cover;
    border: 2px solid var(--ink); flex-shrink: 0; background: var(--cream);
  }
  .person-sub-tags{ display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .person-sub-tags span{
    font-family: var(--font-mono); font-size: 0.7rem;
    background: var(--cream); border: 1px solid var(--ink); padding: 3px 8px; border-radius: 999px;
  }
  .person-card .name{ font-family: var(--font-display); font-weight: 700; font-size: 1.08rem; }
  .person-card .city{ color: var(--ink-soft); font-size: 0.88rem; margin-bottom: 8px; }
  .person-card .hobby-tags{ display: flex; flex-wrap: wrap; gap: 6px; }
  .person-card .hobby-tags span{
    font-family: var(--font-mono); font-size: 0.72rem;
    background: var(--cream); border: 1px solid var(--ink); padding: 4px 9px; border-radius: 999px;
  }
  .person-card .action-btn{
    font-family: var(--font-body); font-weight: 700; font-size: 0.9rem;
    padding: 9px 16px; border-radius: var(--radius); border: 2px solid var(--ink); cursor: pointer;
    background: var(--ink); color: var(--paper); white-space: nowrap;
  }
  .person-card .action-btn:hover{ background: var(--rust); border-color: var(--rust); }
  .person-card .action-btn:disabled{ background: var(--cream); color: var(--ink-soft); cursor: default; border-color: #444; }
  .search-bar{
    width: 100%; font-family: var(--font-body); font-size: 1rem;
    padding: 12px 16px; border: 2px solid var(--ink); border-radius: var(--radius);
    background: var(--paper); color: var(--ink); margin-bottom: 24px;
  }
  .search-bar:focus{ outline: 3px solid var(--green); outline-offset: 1px; }
  .empty-note{ color: var(--ink-soft); padding: 20px 0; }
  .top-nav-links{ display: flex; gap: 18px; align-items: center; }
  .top-nav-links a{ font-weight: 500; font-size: 0.95rem; }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="feed.html" class="logo">
      <img src="assets/logo-mark.png" alt="" class="logo-mark" onerror="this.style.display='none'">
      Hobbiyaa
    </a>
    <div class="top-nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="browse.html"><strong>Browse</strong></a>
      <a href="map.html" class="icon-link" aria-label="Map" title="Map">🗺️</a>
      <a href="messages.html" class="icon-link" aria-label="Messages">💬<span class="badge" id="messagesBadge" style="display:none;"></span></a>
      <button class="btn logout-btn" id="logoutBtn" style="background:none;border:2px solid var(--ink);cursor:pointer;">Log out</button>
    </div>
  </div>
</header>

<main class="browse-wrap">
  <h1>People near you</h1>
  <p class="sub">Same city, shared hobbies — send a request to connect.</p>
  <input type="text" id="searchInput" class="search-bar" placeholder="Search by name or hobby…">
  <div class="people-grid" id="peopleGrid">Loading…</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="toast.js"></script>
<script src="notifications.js"></script>
<script src="blocks.js"></script>
<script src="browse.js"></script>
</body>
</html>
